services:
  meuterminal:
    build: .
    container_name: meuterminal
    restart: unless-stopped
    ports:
      - ${MEUTERMINAL_PORT:-3000}:3000
    volumes:
      # The whole home folder (projects, ~/.claude, ~/.ssh, ~/.local, npm -g, history)
      # survives redeploys. Named volume: panels like Coolify keep it between deploys.
      - meuterminal-home:/root
      # Settings of the tools (starship, rclone remotes/Google Drive login, gh...)
      - ${MEUTERMINAL_CONFIG_DIR:-./config}:/root/.config
      - ${MEUTERMINAL_DATA_DIR:-./data}:/root/data
      # App database: tabs, order, screen snapshots, quick commands, favorites
      - ${MEUTERMINAL_DB_DIR:-./db}:/app/data
    environment:
      # Container timezone
      TZ: ${TZ:-America/Sao_Paulo}
      # The title shown in the web interface
      SITE_TITLE: ${SITE_TITLE:-MeuTerminal}
      # Email + password login (when both are set they replace the PIN)
      AUTH_EMAIL: ${AUTH_EMAIL:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      # Optional two-factor login (authenticator app code). Generate with:
      #   docker compose exec meuterminal node scripts/totp-setup.js
      AUTH_TOTP_SECRET: ${AUTH_TOTP_SECRET:-}
      # PIN login, only used when AUTH_EMAIL/AUTH_PASSWORD are empty. No default: without
      # email+password or a PIN the app refuses to start (ALLOW_NO_LOGIN=true to run open on purpose)
      MEUTERMINAL_PIN: ${MEUTERMINAL_PIN:-}
      ALLOW_NO_LOGIN: ${ALLOW_NO_LOGIN:-}
      # The address you open the app at (used for CORS / cookies)
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      ENABLE_STARSHIP: ${ENABLE_STARSHIP:-true} # Starship prompt in the terminals
      LOCKOUT_TIME: ${LOCKOUT_TIME:-15} # Minutes locked after 5 wrong logins
      MAX_SESSION_AGE: ${MAX_SESSION_AGE:-24} # Hours a login lasts
      # Folder the file manager opens at (default: /root)
      FILES_HOME: ${FILES_HOME:-}
      # Notes tab (on unless set to false)
      NOTES_ENABLED: ${NOTES_ENABLED:-}
      # Webhooks that run a server-side script (off by default - see /admin → Webhooks)
      WEBHOOKS_ENABLED: ${WEBHOOKS_ENABLED:-}
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY:-}

      # (OPTIONAL) Comma-separated list of allowed origins, e.g.
      # https://terminal.example.com,http://192.168.0.10:3000 (unset = allow all)
      # ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}

volumes:
  meuterminal-home:
