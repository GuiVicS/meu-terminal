<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover: draw under notches/home indicator; safe areas are padded in CSS -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <script>
        // iPhone: Safari zooms into any focused field under 16px. styles.css keeps fields at 16px+ on touch;
        // this is the safety net. On iOS maximum-scale only stops that automatic zoom (pinch zoom keeps
        // working), so it's set on iPhones only - on Android it would block pinch zoom.
        if (/iPhone|iPod/.test(navigator.userAgent)) document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover');
    </script>
    <meta name="theme-color" content="#0B0D10">
    <meta name="color-scheme" content="dark light">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title id="pageTitle">MeuTerminal</title>
    <link rel="preload" href="/assets/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/JetBrainsMono-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <script src="config.js"></script>
    <script>
        // Apply the saved theme before first paint (no flash). Settings live in SettingsManager.
        (function () {
            var theme = 'dark';
            try {
                var saved = JSON.parse(localStorage.getItem('meuterminal-settings') || '{}').theme;
                if (saved === 'light' || saved === 'dark') theme = saved;
                else if (saved === 'system') {
                    theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
                }
            } catch (e) { /* storage unavailable: keep dark */ }
            document.documentElement.setAttribute('data-theme', theme);
            // iPhone-only layout (Liquid Glass look, floating agent message box): styles.css,
            // agent/composer.js. Set before first paint so nothing jumps. Settings → Interface can
            // switch it back to the classic layout or put the same visual on any phone.
            var visual = 'glass';
            try {
                visual = JSON.parse(localStorage.getItem('meuterminal-settings') || '{}').iphoneVisual || 'glass';
            } catch (e) { /* storage unavailable: keep the iPhone default */ }
            // Vidro em qualquer celular (iPhone e Android); 'glass-any' é o valor antigo, mesmo efeito
            var isPhone = /iPhone|iPod/.test(navigator.userAgent)
                || (window.matchMedia('(pointer: coarse)').matches
                    && Math.min(window.screen.width || 0, window.screen.height || 0) < 720);
            if (visual !== 'classic' && isPhone) document.documentElement.setAttribute('data-iphone', '');
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="assets/terminal.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
    <link rel="manifest" href="manifest.json">
    <script defer src="./node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script defer src="./node_modules/@xterm/addon-canvas/lib/addon-canvas.js"></script>
    <script defer src="./node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script defer src="./node_modules/@xterm/addon-image/lib/addon-image.js"></script>
    <script defer src="./node_modules/@xterm/addon-ligatures/lib/addon-ligatures.js"></script>
    <script defer src="./node_modules/@xterm/addon-search/lib/addon-search.js"></script>
    <script defer src="./node_modules/@xterm/addon-serialize/lib/addon-serialize.js"></script>
    <script defer src="./node_modules/@xterm/addon-unicode11/lib/addon-unicode11.js"></script>
    <script defer src="./node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
    <script defer src="./node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
</head>
<body class="page-terminal">
    <div class="app" id="app">
        <header class="topbar">
            <div class="brand">
                <span class="brand-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                        stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 8l4 4-4 4"/><path d="M13 16h5"/>
                    </svg>
                </span>
                <span class="brand-title" id="siteTitle">MeuTerminal</span>
                <span class="brand-conn" id="brandConn" data-state="connecting" role="img" aria-label="Conectando"></span>
            </div>

            <!-- Celular, aba de agente: abre a lista de conversas (ui/conversationDrawer.js) -->
            <button type="button" class="conv-btn" id="convBtn" aria-label="Conversas" hidden></button>

            <!-- iPhone: the current session as one pill; tap for the session sheet (ui/sessionSheet.js) -->
            <button type="button" class="session-pill" id="sessionPill" aria-haspopup="dialog" aria-label="Sessões abertas">
                <span class="session-pill-icon" aria-hidden="true"></span>
                <span class="session-pill-name"></span>
                <span class="session-pill-chevron" aria-hidden="true"></span>
            </button>

            <div class="tabstrip">
                <button type="button" class="icon-btn new-tab" id="newTabBtn" aria-label="Nova sessão"></button>
                <div class="tab-list" id="tabList" role="tablist" aria-label="Sessões de terminal"></div>
            </div>

            <div class="topbar-actions">
                <span class="topbar-divider" aria-hidden="true"></span>
                <button type="button" class="icon-btn" id="fullscreenBtn" aria-label="Tela cheia" aria-pressed="false"></button>
                <button type="button" class="icon-btn" id="menuBtn" aria-label="Mais ações" aria-haspopup="menu"></button>
            </div>
        </header>

        <div id="demo-banner" class="demo-banner" hidden>Modo demonstração — o terminal é simulado</div>

        <main class="workspace" id="workspace">
            <div class="terminal-panels"></div>
        </main>

        <footer class="statusbar" id="statusBar"></footer>
        <div class="shortcut-bar" id="shortcutBar" hidden></div>
    </div>
    <script type="module" src="index.js"></script>
</body>
</html>
