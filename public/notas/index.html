<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover: draw under notches/home indicator; safe areas are padded in CSS -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <script>
        // iPhone: Safari zooms into any focused field under 16px. styles.css keeps fields at 16px+ on touch;
        // this is the safety net. On iOS maximum-scale only stops that automatic zoom (pinch zoom keeps
        // working), so it's set on iPhones only - on Android it would block pinch zoom.
        if (/iPhone|iPod/.test(navigator.userAgent)) document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover');
        // Same switch as index.html: iPhone-only visual, or "any phone" when chosen in Settings.
        (function () {
            var visual = 'glass';
            try {
                visual = JSON.parse(localStorage.getItem('meuterminal-settings') || '{}').iphoneVisual || 'glass';
            } catch (e) { /* storage unavailable: keep the iPhone default */ }
            // Vidro em qualquer celular (iPhone e Android); 'glass-any' é o valor antigo, mesmo efeito
            var isPhone = /iPhone|iPod/.test(navigator.userAgent)
                || (window.matchMedia('(pointer: coarse)').matches
                    && Math.min(window.screen.width || 0, window.screen.height || 0) < 720);
            if (visual !== 'classic' && isPhone) document.documentElement.setAttribute('data-iphone', '');
        })();
    </script>
    <meta name="theme-color" content="#0B0D10">
    <meta name="color-scheme" content="dark light">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Anotações">
    <title>Anotações</title>
    <!-- Relative paths here resolve against BASE_PATH + "/" (this page has no trailing slash in its
         URL, "/notas"), same as /admin: no "../" needed, and it still works under a BASE_PATH. -->
    <link rel="preload" href="assets/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <script src="config.js"></script>
    <script>
        // Same bootstrap as the main app: apply the saved theme before first paint (shared storage key,
        // so the theme picked in MeuTerminal or /admin carries over here too).
        (function () {
            var theme = 'dark';
            try {
                var saved = JSON.parse(localStorage.getItem('meuterminal-settings') || '{}').theme;
                if (saved === 'light' || saved === 'dark') theme = saved;
                else if (saved === 'system') {
                    theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
                }
            } catch (e) { /* storage unavailable: keep dark */ }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="assets/notes-icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/notes-icon-192.png">
    <link rel="apple-touch-icon" href="assets/notes-apple-touch-icon.png">
    <link rel="manifest" href="notas/manifest.json">
</head>
<body class="page-terminal">
    <div class="app" id="app">
        <main class="workspace" id="workspace">
            <div class="terminal-panels" id="notesHost"></div>
        </main>
    </div>
    <script type="module" src="notas/notas.js"></script>
</body>
</html>
