<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Marca do terminal">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- so o glifo, sem fundo: usado na tela de login -->
  <g filter="url(#glow)">
    <path d="M140 180 L246 256 L140 332"
          fill="none" stroke="#14B8A6" stroke-width="40"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="278" y="306" width="120" height="40" rx="8" fill="#14B8A6"/>
  </g>
</svg>
