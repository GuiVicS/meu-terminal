<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MeuTerminal">
  <!-- Opaque, no gradients. Artwork kept inside the maskable safe zone (80% circle). -->
  <rect width="512" height="512" fill="#F2F0E3"/>

  <!-- hard offset shadow -->
  <rect x="128" y="142" width="280" height="248" rx="48" fill="#000000"/>

  <!-- window -->
  <rect x="106" y="120" width="280" height="248" rx="48" fill="#A855F7" stroke="#000000" stroke-width="14"/>

  <!-- title bar -->
  <path d="M113 182 H379" stroke="#000000" stroke-width="12"/>
  <circle cx="152" cy="151" r="11" fill="#F2F0E3" stroke="#000000" stroke-width="6"/>
  <circle cx="185" cy="151" r="11" fill="#F2F0E3" stroke="#000000" stroke-width="6"/>
  <circle cx="218" cy="151" r="11" fill="#F2F0E3" stroke="#000000" stroke-width="6"/>

  <!-- prompt ">_" -->
  <path d="M158 232 L210 270 L158 308" fill="none" stroke="#F2F0E3" stroke-width="28"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="234" y="290" width="84" height="28" rx="8" fill="#F2F0E3"/>
</svg>
