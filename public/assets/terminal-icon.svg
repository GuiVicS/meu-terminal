<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Terminal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1C20"/>
      <stop offset="1" stop-color="#141518"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- fundo full-bleed: seguro para icones maskable (zona segura 80%) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <g filter="url(#glow)">
    <path d="M164 208 L238 256 L164 304"
          fill="none" stroke="#14B8A6" stroke-width="28"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="266" y="282" width="86" height="28" rx="6" fill="#14B8A6"/>
  </g>
</svg>
