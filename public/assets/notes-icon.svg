<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Anotações do MeuTerminal">
  <!-- Opaque, no gradients. Artwork kept inside the maskable safe zone (80% circle). Same visual
       language as terminal-icon.svg (cream bg, purple card, hard offset shadow, black strokes). -->
  <rect width="512" height="512" fill="#F2F0E3"/>

  <!-- hard offset shadow -->
  <rect x="128" y="142" width="280" height="248" rx="48" fill="#000000"/>

  <!-- card -->
  <rect x="106" y="120" width="280" height="248" rx="48" fill="#A855F7" stroke="#000000" stroke-width="14"/>

  <!-- note page -->
  <rect x="150" y="156" width="152" height="176" rx="14" fill="#F2F0E3" stroke="#000000" stroke-width="10"/>
  <path d="M174 198 H278" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
  <path d="M174 234 H278" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
  <path d="M174 270 H246" stroke="#000000" stroke-width="14" stroke-linecap="round"/>

  <!-- pin, same mark the app uses for a pinned note -->
  <g transform="translate(300 160) rotate(28)">
    <path d="M0 0 L34 0 L30 30 L17 44 L4 30 Z" fill="#F2F0E3" stroke="#000000" stroke-width="10" stroke-linejoin="round"/>
    <path d="M17 44 L17 66" stroke="#000000" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
