<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Terminal">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1C20"/>
      <stop offset="1" stop-color="#141518"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- painel (DS --card) -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#panel)" stroke="#2B2E34" stroke-width="8"/>

  <!-- barra de titulo -->
  <path d="M40 132 H472" stroke="#2B2E34" stroke-width="6"/>
  <circle cx="104" cy="82" r="12" fill="#2B2E34"/>
  <circle cx="148" cy="82" r="12" fill="#2B2E34"/>
  <circle cx="192" cy="82" r="12" fill="#14B8A6" opacity="0.9"/>

  <!-- prompt: > _ -->
  <g filter="url(#glow)">
    <path d="M150 196 L238 264 L150 332"
          fill="none" stroke="#14B8A6" stroke-width="34"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="272" y="302" width="118" height="34" rx="8" fill="#14B8A6"/>
  </g>
</svg>
