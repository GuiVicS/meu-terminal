<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <script>
        // iPhone: Safari zooms into any focused field under 16px. styles.css keeps fields at 16px+ on touch;
        // this is the safety net. On iOS maximum-scale only stops that automatic zoom (pinch zoom keeps
        // working), so it's set on iPhones only - on Android it would block pinch zoom.
        if (/iPhone|iPod/.test(navigator.userAgent)) document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover');
        // Same switch as index.html: iPhone-only visual, or "any phone" when chosen in Settings.
        (function () {
            var visual = 'glass';
            try {
                visual = JSON.parse(localStorage.getItem('meuterminal-settings') || '{}').iphoneVisual || 'glass';
            } catch (e) { /* storage unavailable: keep the iPhone default */ }
            var isPhone = /iPhone|iPod/.test(navigator.userAgent)
                || (visual === 'glass-any' && window.matchMedia('(pointer: coarse)').matches
                    && Math.min(window.screen.width || 0, window.screen.height || 0) < 720);
            if (visual !== 'classic' && isPhone) document.documentElement.setAttribute('data-iphone', '');
        })();
    </script>
    <meta name="theme-color" content="#0B0D10">
    <meta name="color-scheme" content="dark light">
    <title>Configurações — MeuTerminal</title>
    <!-- Relative paths here resolve against BASE_PATH + "/" (this page has no trailing slash in its
         URL, "/admin"), same as index.html: no "../" needed, and it still works under a BASE_PATH. -->
    <script src="config.js"></script>
    <script>
        // Same bootstrap as the main app: apply the saved theme before first paint.
        (function () {
            var theme = 'dark';
            try {
                var saved = JSON.parse(localStorage.getItem('meuterminal-settings') || '{}').theme;
                if (saved === 'light' || saved === 'dark') theme = saved;
                else if (saved === 'system') {
                    theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
                }
            } catch (e) { /* storage unavailable: keep dark */ }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="assets/terminal.svg">
</head>
<body class="page-admin">
    <div class="admin" id="admin">
        <header class="admin-topbar">
            <a class="brand" href="." aria-label="Voltar ao MeuTerminal">
                <span class="brand-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                        stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m15 18-6-6 6-6"/>
                    </svg>
                </span>
                <span class="brand-title">Configurações</span>
            </a>
            <button type="button" class="icon-btn admin-nav-toggle" id="adminNavToggle" aria-label="Seções" aria-expanded="false" aria-controls="adminNav" hidden></button>
        </header>
        <div class="admin-body">
            <nav class="admin-nav" id="adminNav" aria-label="Seções">
                <ul id="adminNavList"></ul>
            </nav>
            <main class="admin-main" id="adminMain">
                <div class="admin-page" id="adminPage"></div>
            </main>
        </div>
    </div>
    <script type="module" src="admin/admin.js"></script>
</body>
</html>
