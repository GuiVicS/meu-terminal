<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#121212">
    <meta name="color-scheme" content="dark light">
    <title id="pageTitle">MeuTerminal</title>
    <script src="config.js"></script>
    <script>
        // Same theme preference as the app (saved by the settings dialog)
        (function () {
            var theme = 'dark';
            try {
                var saved = JSON.parse(localStorage.getItem('dumbterm-settings') || '{}').theme;
                if (saved === 'light' || saved === 'dark') theme = saved;
                else if (saved === 'system') {
                    theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
                }
            } catch (e) { /* keep dark */ }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="assets/terminal.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
</head>
<body class="page-login">
    <main class="login">
        <div class="login-card">
            <div id="demo-banner" class="demo-banner demo-banner-login" hidden>Modo demonstração — o terminal é simulado</div>
            <span class="brand-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor"
                    stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 8l4 4-4 4"/><path d="M13 16h5"/>
                </svg>
            </span>
            <h1 class="login-title" id="siteTitle">MeuTerminal</h1>
            <p class="login-subtitle" id="loginSubtitle">Entre para acessar suas sessões</p>

            <!-- Email + password (AUTH_EMAIL / AUTH_PASSWORD) -->
            <form id="emailForm" class="login-form" novalidate hidden>
                <label class="field">
                    <span class="field-label">Email</span>
                    <input type="email" name="email" autocomplete="username" inputmode="email"
                        autocapitalize="off" spellcheck="false" required>
                </label>
                <label class="field">
                    <span class="field-label">Senha</span>
                    <input type="password" name="password" autocomplete="current-password" required>
                </label>
                <p class="login-error" id="loginError" role="alert"></p>
                <button type="submit" class="btn btn-primary">Entrar</button>
            </form>

            <!-- Legacy PIN (only when email login is not configured) -->
            <form id="pinForm" action="verify-pin" method="POST" hidden>
                <div class="pin-input-container"></div>
                <div class="pin-error" role="alert" aria-hidden="true">PIN incorreto. Tente novamente.</div>
            </form>
        </div>
    </main>
    <script type="module" src="login.js"></script>
</body>
</html>
